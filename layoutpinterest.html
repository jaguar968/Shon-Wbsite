<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shön — Think Beautifully</title>
  <link rel="stylesheet" href="mstyle.css" />
  <style>
    .portfolio-section {
      margin-top: 3rem;
    }
    .scroll-hint {
      text-align: center;
      font-size: 0.9rem;
      color: gray;
      margin-bottom: 0.5rem;
    }
    .scroll-hint-popup {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      font-size: 0.9rem;
      z-index: 1000;
      animation: fadeout 4s forwards;
    }
    @keyframes fadeout {
      0% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    .portfolio-grid-wrapper {
      overflow-x: auto;
      direction: rtl;
    }
    .portfolio-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
      min-width: max-content;
    }
    .portfolio-row {
      display: flex;
      gap: 1rem;
      direction: ltr;
    }
    .card {
      background: var(--card-bg, #fff);
      padding: 0.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 120px;
      text-align: center;
      flex: 0 0 auto;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .card-title {
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }

    @media (min-width: 768px) {
      .portfolio-grid-wrapper {
        overflow: visible;
      }
      .portfolio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 1rem;
      }
      .portfolio-row {
        flex-direction: row;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <!-- Other sections here -->
  
  <section id="projects" class="section portfolio-section">
    <h2>Our Work</h2>
    <div class="scroll-hint-popup" id="scrollPopup">Scroll sideways to explore →</div>
    <div class="portfolio-grid-wrapper">
      <div class="portfolio-grid" id="portfolioGrid"></div>
    </div>
    <p class="marker"><b>More work coming soon</b></p>
  </section>

  <script>
    const logoProjects = [
      { title: "April McClalen", images: ["assets/aprilmcclalen.webp"], link: "Projects.html" },
      { title: "Devalle Construction", images: ["assets/boardArtboard 1CONS1.webp"], link: "Projects.html" },
      { title: "Lassen Construction", images: ["assets/lassenlogo1Artboard 1.webp"], link: "Projects.html" },
      { title: "JM Equipment repair", images: ["assets/JM Equipment repairlogArtboard 1.webp"], link: "Projects.html" },
      { title: "Parramatta Consultancy", images: ["assets/PARRAMATTA2Artboard 1@2x.webp"], link: "Projects.html" },
      { title: "MFS", images: ["assets/MFSlogo1Artboard 1.webp"], link: "Projects.html" },
      { title: "River Grille", images: ["assets/RG01Artboard 1.webp"], link: "Projects.html" },
      { title: "Walsh Capital", images: ["assets/Walsh2Artboard 1@3x.webp"], link: "Projects.html" },
      { title: "City Grill", images: ["assets/CITYGRILLArtboard 1.svg"], link: "Projects.html" },
      { title: "Capstan Software solutions", images: ["assets/CAPSTANArtboard 1.webp"], link: "Projects.html" },
      { title: "The Boardroom Africa", images: ["assets/boardArtboard 1board2.webp"], link: "Projects.html" },
      { title: "Edmonton Church", images: ["assets/boardArtboard 11.webp"], link: "Projects.html" },
      { title: "Iron Hand", images: ["assets/ironhandArtboard 1@2x.webp"], link: "Projects.html" },
      { title: "Advent Mission", images: ["assets/adventArtboard 1@2x.webp"], link: "Projects.html" },
      { title: "River Grille 2", images: ["assets/RIVERGRILLE1Artboard 1@2x.webp"], link: "Projects.html" },
      { title: "River Grille 3", images: ["assets/RIVERGRILLE2Artboard 1.webp"], link: "Projects.html" },
      { title: "Parramatta Consultancy 2", images: ["assets/PARRAMATTA3Artboard 1-100.jpg"], link: "Projects.html" },
      { title: "Venous Ventures", images: ["assets/venousvArtboard 1.webp"], link: "Projects.html" },
      { title: "CAR-Thena", images: ["assets/CAR-TArtboard 1.svg"], link: "Projects.html" },
      { title: "CAR-Thena 2", images: ["assets/Carthena2Artboard 1.svg"], link: "Projects.html" },
      { title: "Body-Fit Gym", images: ["assets/GymL1Artboard 1.svg"], link: "Projects.html" },
      { title: "Camelot studios", images: ["assets/camelotpnArtboard 1.webp"], link: "Projects.html" }
    ];

    const grid = document.getElementById("portfolioGrid");

    function groupIntoRows(array, size) {
      const result = [];
      for (let i = 0; i < array.length; i += size) {
        result.push(array.slice(i, i + size));
      }
      return result;
    }

    const isMobile = window.innerWidth < 768;
    const groupedProjects = isMobile ? groupIntoRows(logoProjects, 6) : [logoProjects];

    groupedProjects.forEach(row => {
      const rowDiv = document.createElement("div");
      rowDiv.className = "portfolio-row";

      row.forEach(project => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => window.location.href = project.link;

        project.images.forEach(imgSrc => {
          const img = document.createElement("img");
          img.src = imgSrc;
          img.alt = project.title;
          card.appendChild(img);
        });

        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = project.title;
        card.appendChild(title);

        rowDiv.appendChild(card);
      });

      grid.appendChild(rowDiv);
    });
  </script>
</body>
</html>

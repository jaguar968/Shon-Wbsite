<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - Shön Design</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #AFDDE5;
      color: #003135;
      text-align: center;
      padding: 2rem;
    }

    .message-box {
      background: #fff;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }

    h1 {
      color: #0FA4AF;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      color: #024950;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background-color: #964734;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background-color: #722f23;
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h1>Thank You!</h1>
    <p>We have received your request and will be in touch within 1 business hour.</p>
    <a href="index.html">Return to Homepage</a>
  </div>
</body>
</html>
